name: Сборка и публикация

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка сайта из data/snapshot.json
        run: python3 scripts/build.py
      - name: Проверка каталога, источников и интерфейса
        run: |
          for test in scripts/test_*.py; do python3 "$test" || exit 1; done
          for test in scripts/test_*.cjs; do
            case "$test" in *_ui.cjs) continue ;; esac
            node "$test" || exit 1
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
